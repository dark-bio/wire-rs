[package]
name = "darkbio-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.darkbio-wire]
path = ".."
features = ["fuzz"]

[[bin]]
name = "server_protocol"
path = "fuzz_targets/server_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_protocol"
path = "fuzz_targets/client_protocol.rs"
test = false
doc = false
bench = false
