[package]
name = "darkbio-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.darkbio-wire]
path = ".."
features = ["fuzz"]

[[bin]]
name = "server-protocol"
path = "fuzz_targets/server_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client-protocol"
path = "fuzz_targets/client_protocol.rs"
test = false
doc = false
bench = false
