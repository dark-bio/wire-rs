[package]
name = "darkbio-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.darkbio-wire]
path = ".."
features = ["fuzz"]

[[bin]]
name = "transport-server"
path = "fuzz_targets/transport_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport-client"
path = "fuzz_targets/transport_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport-duplex"
path = "fuzz_targets/transport_duplex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol-session"
path = "fuzz_targets/protocol_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol-connection"
path = "fuzz_targets/protocol_connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol-envelope"
path = "fuzz_targets/protocol_envelope.rs"
test = false
doc = false
bench = false

# The fuzzers exercise the wire, not its dependencies. The Makefile builds with
# -O, so these profiles decide the checks. The wire and the fuzz targets keep
# debug assertions and overflow checks. The dependencies build as plain release
# code, since their checks made the crypto slow every input down about threefold.
[profile.release]
debug-assertions = true
overflow-checks = true

[profile.release.package."*"]
debug-assertions = false
overflow-checks = false

[profile.release.package.darkbio-wire]
debug-assertions = true
overflow-checks = true
